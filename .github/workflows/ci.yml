# CI: тесттер → Docker бейнесі + smoke-тест → (тек шаблон репода) бейнені GHCR-ге жариялау.
# Командалардың репосында соңғы қадам орындалмайды: деплойды Coolify өзі жасайды (main-ге push).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: store_db
          POSTGRES_USER: store_app
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U store_app -d store_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DB_NAME: store_db
      DB_USER: store_app
      DB_PASSWORD: ci-only
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      # Тесттер әзірлеу режимінде (хэшсіз статика, браузерлік API)
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Миграциялар толық әрі жаңа ма
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  docker:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Бейнені жинап, production-ға жақын режимде іске қосу (smoke)
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost:8000/api/health/
      - name: Сәтсіз болса — логтар
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()

      # Тек Qoldanba шаблонының өзінде: дайын бейне — команданың алғашқы деплойы осыдан басталады
      - name: GHCR тегтері
        id: meta
        if: github.event.repository.is_template && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/login-action@v3
        if: steps.meta.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outcome == 'success'
      - uses: docker/build-push-action@v6
        if: steps.meta.outcome == 'success'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
